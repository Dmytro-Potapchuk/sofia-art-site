name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image tags (GHCR requirement)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=${REPO}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${REPO}:latest" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}" \
            --build-arg "REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}" \
            --build-arg "REACT_APP_WEB3FORMS_ACCESS_KEY=${{ secrets.REACT_APP_WEB3FORMS_ACCESS_KEY }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            .
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy to VPS via SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "GHCR_TOKEN='${GHCR_TOKEN}' IMAGE='${IMAGE}' VPS_DEPLOY_PATH='${VPS_DEPLOY_PATH}' GITHUB_ACTOR='${GITHUB_ACTOR}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi
          cd "$VPS_DEPLOY_PATH"
          export IMAGE
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          REMOTE
