# Plik na VPS — /opt/sofia-art/docker-compose.yml
# Wymaga sieci bankflay (Caddy): reverse_proxy sofia-art-web:80 w ~/bankflay/Caddyfile
services:
  web:
    image: ${IMAGE}
    container_name: sofia-art-web
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - default
      - bankflay

networks:
  bankflay:
    external: true
    name: bankflay_default
