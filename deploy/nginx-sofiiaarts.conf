# Skopiuj na VPS:
#   sudo cp nginx-sofiiaarts.conf /etc/nginx/sites-available/sofiiaarts.pl
#   sudo ln -sf /etc/nginx/sites-available/sofiiaarts.pl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Potem SSL: sudo certbot --nginx -d sofiiaarts.pl -d www.sofiiaarts.pl
#
# Aplikacja Docker musi działać na porcie 8080 (HTTP_PORT=8080 w /opt/sofia-art/.env)

server {
    listen 80;
    listen [::]:80;
    server_name sofiiaarts.pl www.sofiiaarts.pl;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
